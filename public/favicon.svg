<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="JE — Rick and Morty Explorer">
  <defs>
    <!-- Fondo cósmico: del azul sideral al espacio profundo -->
    <radialGradient id="bg" cx="50%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#1f2438"/>
      <stop offset="100%" stop-color="#0f111a"/>
    </radialGradient>

    <!-- Anillo portal: cian -> verde -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b5cc"/>
      <stop offset="100%" stop-color="#97ce4c"/>
    </linearGradient>

    <!-- Glow fosforescente para las letras -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Disco de fondo -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>

  <!-- Anillo perimetral con degradado (referencia al portal interdimensional) -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#ring)" stroke-width="2.5"/>

  <!-- Anillo interior sutil -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#00b5cc" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Iniciales JE: fuente del sistema, peso máximo para legibilidad a 16px -->
  <text
    x="32"
    y="41"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
    font-size="27"
    font-weight="900"
    letter-spacing="-1.5"
    fill="#97ce4c"
    filter="url(#glow)"
  >JE</text>

  <!-- Línea de acento inferior en cian -->
  <line x1="24" y1="48.5" x2="40" y2="48.5" stroke="#00b5cc" stroke-width="2" stroke-linecap="round"/>
</svg>
