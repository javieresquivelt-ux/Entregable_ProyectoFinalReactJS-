name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches:
      - main   # Activa el workflow en cada push a la rama principal.
  workflow_dispatch: # Permite lanzarlo manualmente desde la interfaz de GitHub.

# Permisos mínimos necesarios para publicar en GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evitar despliegues simultáneos: si llega un push mientras se despliega uno
# anterior, este último se cancela para que siempre prevalezca el más reciente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Build
  # Compila la aplicación React con Vite y sube el artefacto de producción.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v7

      - name: 🟢 Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instalar dependencias
        # `npm ci` es más rápido y estricto que `npm install` en CI:
        # respeta exactamente el package-lock.json y falla si hay discrepancias.
        run: npm ci

      - name: 🔍 Lint del código
        # El pipeline falla antes del build si hay errores de ESLint.
        run: npm run lint

      - name: 🏗️ Compilar para producción
        # Genera el bundle optimizado en el directorio `dist/`.
        # `base: './'` en vite.config.js asegura rutas relativas compatibles con GitHub Pages.
        run: npm run build

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v6
        with:
          # Auto-habilita Pages (Source = GitHub Actions) si aún no lo está.
          enablement: true

      - name: 📤 Subir artefacto de producción
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist   # Directorio generado por Vite.

  # ---------------------------------------------------------------------------
  # JOB 2: Deploy
  # Publica el artefacto en GitHub Pages solo si el build fue exitoso.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: build           # Solo corre si el job "build" pasó.
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🌐 Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
